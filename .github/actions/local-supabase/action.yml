name: Local Supabase
description: Start the local Supabase stack with migrations and seed applied, and export its connection details.
runs:
  using: composite
  steps:
    - name: Start Supabase
      shell: bash
      run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta
    - name: Export connection details
      shell: bash
      run: |
        status="$(pnpm exec supabase status -o json)"
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$status")"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status")"
          echo "DATABASE_URL=$(jq -r '.DB_URL' <<<"$status")"
          echo "SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' <<<"$status")"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          echo "MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL' <<<"$status")"
          echo "APP_URL=http://localhost:3000"
        } >> "$GITHUB_ENV"
