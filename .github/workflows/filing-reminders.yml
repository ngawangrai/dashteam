# Reminds admins about TDS filing on the reminder days (a setting: the 5th, 8th and 10th to start),
# until the month is marked filed. Runs daily; the app decides whether today is a reminder day and
# sends at most one reminder a day, so running it twice is harmless.
name: Filing reminders

on:
  schedule:
    # 02:30 UTC is 08:30 in Thimphu.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        run: scripts/ci/require-secrets.sh "Settings → Secrets and variables → Actions → Repository secrets" APP_URL CRON_SECRET
      - name: Ask DashTeam to send today's reminder
        run: |
          if ! reply="$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$APP_URL/api/cron/filing-reminders" \
            -H "Authorization: Bearer $CRON_SECRET" 2>&1)"; then
            echo "DashTeam didn't take the reminder request: $reply" | tee -a "$RUNNER_TEMP/alert.txt"
            exit 1
          fi
          echo "$reply"
      - name: Email an alert
        if: failure()
        uses: ./.github/actions/alert
        with:
          resend-api-key: ${{ secrets.ALERT_RESEND_API_KEY }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ vars.ALERT_EMAIL_FROM }}
