name: Migrate

# Applies new migrations on push to main: staging first, and production only if staging succeeds.
# Each environment holds its own MIGRATE_DATABASE_URL (that project's session pooler string), so a
# job can reach one project and nothing else on the Supabase account.
on:
  push:
    branches: [main]
    paths: [supabase/migrations/**]
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        run: scripts/ci/require-secrets.sh "Settings → Environments → staging → Environment secrets" MIGRATE_DATABASE_URL
      - uses: ./.github/actions/setup
      # A paused free project shows up here by name, not as a vague connection failure further on.
      - name: Check the staging database
        run: node scripts/ci/check-database.ts MIGRATE_DATABASE_URL staging
      - name: Show migrations waiting to apply
        run: pnpm exec supabase migration list --db-url "$MIGRATE_DATABASE_URL"
      # No seed: demo data never reaches a hosted project.
      - name: Apply migrations
        run: pnpm exec supabase db push --db-url "$MIGRATE_DATABASE_URL" --yes
      - name: Email an alert
        if: failure()
        uses: ./.github/actions/alert
        with:
          resend-api-key: ${{ secrets.ALERT_RESEND_API_KEY }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ vars.ALERT_EMAIL_FROM }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Runs only after staging succeeds, so a broken migration never reaches salary data.
    environment: production
    timeout-minutes: 10
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        run: scripts/ci/require-secrets.sh "Settings → Environments → production → Environment secrets" MIGRATE_DATABASE_URL
      - uses: ./.github/actions/setup
      - name: Check the production database
        run: node scripts/ci/check-database.ts MIGRATE_DATABASE_URL production
      - name: Show migrations waiting to apply
        run: pnpm exec supabase migration list --db-url "$MIGRATE_DATABASE_URL"
      - name: Apply migrations
        run: pnpm exec supabase db push --db-url "$MIGRATE_DATABASE_URL" --yes
      - name: Email an alert
        if: failure()
        uses: ./.github/actions/alert
        with:
          resend-api-key: ${{ secrets.ALERT_RESEND_API_KEY }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ vars.ALERT_EMAIL_FROM }}
