<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Inter',sans-serif;color:#1c1c1e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:12px;">
      <tr>
        <td style="padding:32px 24px;">
          <p style="margin:0 0 8px;font-size:15px;color:#6c6c70;">DashTeam</p>
          <p style="margin:0 0 24px;font-size:17px;line-height:22px;">Here is your sign-in code. It works for 10 minutes.</p>
          <p style="margin:0 0 24px;font-size:34px;line-height:41px;font-weight:600;letter-spacing:6px;font-variant-numeric:tabular-nums;">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:18px;color:#6c6c70;">If you didn’t try to sign in, you can ignore this email. Nobody can sign in without this code.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
